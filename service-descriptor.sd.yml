organization: Billing Platform
description: Issues invoice documents in response to PaymentSucceeded events from Payments.
computeClassification:
  dataType: [None]
links:
  healthcheck:
    uri: /health
  source:
    url: https://github.com/Team-Demo-12/invoicing-service
compose:
  microservice:
    image: ghcr.io/Team-Demo-12/invoicing-service
    tag: ${DOCKER_TAG}
    ports: [8080:8080]
buildNumber: ${DOCKER_TAG}
config:
  environmentVariables:
    SERVICE_NAME: invoicing-service
