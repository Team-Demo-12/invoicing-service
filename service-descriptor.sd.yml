organization: Billing Platform
description: Issues invoice documents in response to PaymentSucceeded events from Payments.
computeClassification:
  dataType: [None]
links:
  healthcheck:
    uri: /health
  source:
    url: https://github.com/highvelocity-rca-demo/invoicing-service
compose:
  microservice:
    image: ghcr.io/highvelocity-rca-demo/invoicing-service
    tag: ${DOCKER_TAG}
    ports: [8080:3000]
buildNumber: ${DOCKER_TAG}
config:
  environmentVariables:
    NODE_ENV: production
    SERVICE_NAME: invoicing-service
